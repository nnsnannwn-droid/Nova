<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA — Console Experience</title>
<style>
:root{
  --bg:#07080c;--fg:#f5f2eb;--dim:#96959b;
  --panel:rgba(19,20,26,.78);--acc:#d8b875;
  --c1:#34302a;--c2:#090a0e;
  --line:rgba(231,211,168,.16);--gold:#d8b875;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;min-height:100%;background:var(--bg)}
body{
  color:var(--fg);font-family:Inter,"Segoe UI",Arial,sans-serif;
  overflow:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  letter-spacing:.01em;-webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button{ -webkit-tap-highlight-color:transparent }
#bg{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(ellipse at 78% 12%,color-mix(in srgb,var(--c1) 80%,transparent),transparent 48%),
    radial-gradient(ellipse at 12% 100%,rgba(151,116,57,.13),transparent 42%),
    linear-gradient(135deg,#090a0f 0%,var(--c2) 55%,#08090d 100%);
  transition:background 1s ease;
}
#bg:before,#bg:after{
  content:"";position:absolute;width:58vmax;height:58vmax;border-radius:50%;
  filter:blur(100px);opacity:.18;background:var(--acc);
  animation:drift 22s ease-in-out infinite alternate;
}
#bg:before{left:-24vmax;top:-28vmax}
#bg:after{right:-25vmax;bottom:-34vmax;background:#71618d;animation-delay:-8s}
#bg{isolation:isolate}
#bg:after{mix-blend-mode:screen}
@keyframes drift{to{transform:translate(7vmax,5vmax) scale(1.12)}}
#app{
  position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding:25px clamp(18px,5vw,76px) 18px;
}
header{
  display:flex;align-items:center;gap:clamp(9px,1.5vw,22px);
  min-height:54px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:17px;
}
header:before{
  content:"NOVA";font-size:12px;letter-spacing:.34em;font-weight:800;color:var(--gold);
  padding-right:clamp(8px,2vw,28px);white-space:nowrap;
}
nav{display:flex;gap:clamp(14px,2.5vw,34px);flex:1;justify-content:center}
nav button{
  position:relative;background:none;border:0;color:var(--dim);
  font-size:clamp(12px,1.4vw,15px);font-weight:600;letter-spacing:.035em;
  padding:9px 1px;cursor:pointer;transition:color .25s;
}
nav button:after{
  content:"";position:absolute;left:50%;right:50%;bottom:-18px;height:2px;
  background:var(--gold);transition:left .25s,right .25s;
}
nav button.on{color:var(--fg)}
nav button.on:after{left:0;right:0}
nav button:hover{color:#fff}
.ic{
  flex:0 0 auto;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);
  color:var(--fg);width:40px;height:40px;border-radius:13px;cursor:pointer;font-size:17px;
  display:grid;place-items:center;transition:.25s;backdrop-filter:blur(18px);
}
.ic:hover,.ic:focus-visible{transform:translateY(-2px);border-color:var(--gold);color:var(--gold);outline:none;background:rgba(216,184,117,.1)}
#clock{font-size:13px;letter-spacing:.08em;min-width:52px;text-align:right;color:#d4d0c7;font-variant-numeric:tabular-nums}
#avatar{
  flex:0 0 auto;width:39px;height:39px;border-radius:13px;
  background:linear-gradient(145deg,#e7d4a7,#967344 52%,#41301d);
  border:1px solid rgba(255,255,255,.55);cursor:pointer;transition:.25s;
  box-shadow:0 5px 20px #0008;
}
#avatar:hover{transform:translateY(-2px) rotate(3deg)}
main{
  flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  padding-bottom:2vh;min-height:0;padding-top:5vh;
}
#info{max-width:620px;margin-bottom:24px;min-height:150px}
#info h1{
  font-size:clamp(32px,5.5vw,66px);font-weight:650;letter-spacing:-.055em;
  line-height:1.02;text-wrap:balance;animation:rise .55s both;
}
#info p{color:#c4c0b8;margin:13px 0 19px;line-height:1.65;font-size:clamp(13px,1.5vw,16px);max-width:530px;animation:rise .65s both}
@keyframes rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
#actions{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.play{
  background:linear-gradient(135deg,#f0dfb8,#c9a66a);color:#17130d;border:0;
  border-radius:9px;padding:13px 29px;font-size:13px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;cursor:pointer;transition:.25s;
  box-shadow:0 8px 28px rgba(0,0,0,.25);
}
.play:hover{transform:translateY(-3px);box-shadow:0 12px 34px rgba(0,0,0,.4),0 0 0 1px #f4dfb2}
.bar{width:100%;height:3px;background:rgba(255,255,255,.16);border-radius:4px;margin:0 0 16px;max-width:260px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#a9874f,#f0d9a8);transition:width .6s}
#row{
  display:flex;gap:17px;overflow-x:auto;padding:25px 8px 20px;
  scroll-snap-type:x proximity;scrollbar-width:none;align-items:center;
}
#row::-webkit-scrollbar{display:none}
.tile{
  flex:0 0 auto;width:clamp(112px,14vw,174px);aspect-ratio:1.12;border-radius:13px;
  border:1px solid rgba(255,255,255,.13);cursor:pointer;position:relative;overflow:hidden;
  color:#fff;font-weight:700;font-size:clamp(12px,1.3vw,15px);text-align:left;padding:14px;
  display:flex;align-items:flex-end;transition:transform .3s,box-shadow .3s,border-color .3s;
  scroll-snap-align:center;box-shadow:0 12px 28px rgba(0,0,0,.24);
}
.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 20%,rgba(0,0,0,.76) 100%)}
.tile span{position:relative;z-index:1;text-shadow:0 2px 10px #000}
.tile.sel{
  transform:translateY(-7px) scale(1.045);margin:0 5px;
  box-shadow:0 0 0 1px var(--gold),0 18px 42px rgba(0,0,0,.58);z-index:2;
  border-color:var(--gold);
}
.tile.sel:before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.26) 50%,transparent 70%);
  transform:translateX(-120%);animation:shine 3s infinite;z-index:2;
}
@keyframes shine{to{transform:translateX(120%)}}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px;
  overflow:auto;padding:6px;max-height:60vh;scrollbar-width:thin;scrollbar-color:#8e744b transparent;
}
.card{
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:18px;
  cursor:pointer;transition:.25s;text-align:left;color:var(--fg);font-size:14px;
  min-height:95px;backdrop-filter:blur(16px);
}
.card:hover{transform:translateY(-4px);border-color:rgba(216,184,117,.55);background:rgba(216,184,117,.09)}
.card b{display:block;font-size:25px;margin-bottom:10px;color:var(--gold)}
.layer{
  position:fixed;inset:0;display:none;place-items:center;
  background:rgba(3,4,7,.76);backdrop-filter:blur(16px);z-index:20;padding:16px;
}
.layer.on{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.box{
  background:linear-gradient(145deg,rgba(29,29,32,.98),rgba(12,13,17,.98));
  border:1px solid rgba(216,184,117,.23);border-radius:18px;padding:clamp(20px,4vw,30px);
  width:min(460px,92vw);max-height:84vh;overflow:auto;
  box-shadow:0 28px 90px rgba(0,0,0,.6);
}
.box h2{margin-bottom:17px;font-size:22px;font-weight:650;letter-spacing:-.025em}
.row{
  display:flex;justify-content:space-between;align-items:center;padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.075);gap:12px;color:#d9d5cc;font-size:14px;
}
.row b{color:var(--gold)}
.sw{
  width:48px;height:27px;border-radius:20px;background:#424149;border:0;
  position:relative;cursor:pointer;transition:.25s;flex:0 0 auto;
}
.sw:after{
  content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;
  border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 5px #0005;
}
.sw.on{background:#b99a62}.sw.on:after{left:24px}
input[type=range]{width:150px;accent-color:var(--gold)}
.close{
  margin-top:14px;width:100%;background:rgba(255,255,255,.07);color:#f4f0e7;
  border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:12px;
  font-size:14px;font-weight:600;cursor:pointer;transition:.2s;
}
.close:hover{background:rgba(216,184,117,.13);border-color:rgba(216,184,117,.4)}
.swatch{display:flex;gap:11px;flex-wrap:wrap;padding-top:15px}
.swatch button{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;transition:.2s;box-shadow:0 3px 10px #0005}
.swatch button:hover{transform:scale(1.15);border-color:#fff}
#launch{background:rgba(3,4,7,.97);z-index:30}
#launch .box{background:none;border:0;text-align:center;box-shadow:none}
.spin{
  width:58px;height:58px;border:2px solid rgba(255,255,255,.13);border-top-color:var(--gold);
  border-radius:50%;margin:0 auto 20px;animation:sp 1s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{
  position:fixed;left:50%;bottom:25px;transform:translate(-50%,80px);
  background:#e8d4ad;color:#17130d;padding:12px 21px;border-radius:9px;
  font-size:13px;font-weight:750;letter-spacing:.015em;transition:.35s;z-index:40;
  max-width:90vw;box-shadow:0 12px 30px #0006;text-align:center;
}
#toast.on{transform:translate(-50%,0)}
#q{outline:none}
#q:focus{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(216,184,117,.12)}
@media (max-width:700px){
  #app{padding:17px 17px 12px}
  header{gap:8px;padding-bottom:13px}
  header:before{font-size:10px;letter-spacing:.2em;padding-right:3px}
  nav{gap:clamp(8px,2vw,15px)}
  nav button{font-size:11px;letter-spacing:0}
  nav button:after{bottom:-14px}
  .ic{width:35px;height:35px;border-radius:11px;font-size:15px}
  #avatar{width:35px;height:35px;border-radius:11px}
  #clock{display:none}
  main{padding-top:3vh;padding-bottom:1vh}
  #info{min-height:130px;margin-bottom:12px}
  #info h1{font-size:clamp(29px,8vw,48px)}
  #info p{font-size:13px;margin:9px 0 14px}
  #row{gap:12px;padding:20px 5px 16px}
  .tile{width:clamp(108px,31vw,145px);padding:11px}
  .tile.sel{transform:translateY(-4px) scale(1.025);margin:0 2px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px}
  .card{padding:14px;min-height:86px}
}
@media (max-width:390px){
  header:before{display:none}
  nav{justify-content:flex-start}
  nav button{font-size:10px}
  .ic{width:32px;height:32px}
  #avatar{width:32px;height:32px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
<header>
  <button class="ic" id="bSearch" title="Поиск">⌕</button>
  <nav id="tabs"></nav>
  <button class="ic" id="bCenter" title="Центр управления">⚙</button>
  <button class="ic" id="bPower" title="Питание">⏻</button>
  <span id="clock"></span>
  <button id="avatar" title="Профиль" aria-label="Профиль"></button>
</header>
<main>
  <div id="info"></div>
  <div id="view"></div>
</main>
</div>

<div class="layer" id="center"><div class="box"><h2>Центр управления</h2>
  <div class="row"><span>Wi‑Fi</span><button class="sw on" data-t="Wi‑Fi"></button></div>
  <div class="row"><span>Bluetooth</span><button class="sw" data-t="Bluetooth"></button></div>
  <div class="row"><span>Не беспокоить</span><button class="sw" data-t="Не беспокоить"></button></div>
  <div class="row"><span>Звук</span><input type="range" id="vol" min="0" max="100" value="60"></div>
  <div class="row"><span>Яркость</span><input type="range" id="bri" min="30" max="100" value="100"></div>
  <div class="swatch" id="themes"></div>
  <button class="close" data-close>Закрыть</button></div></div>

<div class="layer" id="power"><div class="box"><h2>Питание</h2>
  <button class="close" id="rest">Режим покоя</button>
  <button class="close" id="restart">Перезагрузить</button>
  <button class="close" data-close>Отмена</button></div></div>

<div class="layer" id="profile"><div class="box"><h2>Профиль</h2>
  <div class="row"><span>Игрок</span><b id="nick">Player_One</b></div>
  <div class="row"><span>Статус</span><button class="sw on" data-t="Онлайн‑статус"></button></div>
  <div class="row"><span>Трофеи</span><b id="trophyCount">0</b></div>
  <button class="close" id="rename">Сменить ник</button>
  <button class="close" data-close>Закрыть</button></div></div>

<div class="layer" id="search"><div class="box"><h2>Поиск</h2>
  <input id="q" placeholder="Название игры…" style="width:100%;padding:12px;border-radius:12px;border:1px solid #fff3;background:#0b1024;color:#fff;font-size:16px">
  <div id="res" style="margin-top:12px"></div>
  <button class="close" data-close>Закрыть</button></div></div>

<div class="layer" id="launch"><div class="box"><div class="spin"></div><h2 id="lt"></h2><p id="lp" style="color:#8d97b0;margin-top:8px"></p>
  <button class="close" id="quit" style="margin-top:24px">Выйти из игры</button></div></div>

<div id="toast"></div>

<script>
const games=[
 {n:"Нейрон: Рассвет",g:"Экшен",c:["#ff6a3d","#7a1fa2"],d:"Кибер-город просыпается. Взламывай системы и меняй ход истории.",p:62},
 {n:"Тихий берег",g:"Приключение",c:["#2ec4b6","#0b3954"],d:"Спокойное путешествие вдоль побережья забытых островов.",p:18},
 {n:"Гонка Зенит",g:"Гонки",c:["#ffd23f","#d00000"],d:"Скорость, дрифт и ночные трассы мегаполиса.",p:90},
 {n:"Орбита 9",g:"Симулятор",c:["#6c63ff","#050a30"],d:"Построй станцию и доберись до края системы.",p:35},
 {n:"Клинок и пепел",g:"RPG",c:["#c1121f","#1b1b1b"],d:"Тёмное фэнтези с огромным открытым миром.",p:5},
 {n:"Футбол Арена",g:"Спорт",c:["#38b000","#004b23"],d:"Сезон, трансферы и матчи онлайн.",p:74},
 {n:"Лабиринт снов",g:"Головоломка",c:["#ff7eb6","#3d1a78"],d:"Меняй гравитацию и находи выход из чужих снов.",p:48}
];
const tabs=["Игры","Медиа","Магазин","Трофеи"];
const themes=[["#1a3a8f","#0a0f24","#4aa8ff"],["#6b1a8f","#1a0524","#ff6fae"],["#0f6b4a","#03140d","#3ddc97"],["#8f3a1a","#240a05","#ffb347"]];
const media=[["▶","Видео"],["♪","Музыка"],["◉","Стрим"],["☁","Облако"],["✦","Новости"],["☺","Друзья"]];
const shop=[["Новинки",""],["Скидки","−40%"],["Подписка","1 мес."],["Дополнения",""],["Демо","Бесплатно"],["Предзаказ",""]];
const trophies=[["Первый шаг","Запусти любую игру"],["Исследователь","Открой все вкладки"],["Дизайнер","Смени тему оформления"],["Меломан","Включи музыку"],["Коллекционер","Запусти 3 разные игры"]];
const state={tab:0,sel:0,done:new Set(),played:new Set(),nick:"Player_One"};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const view=$("#view"),info=$("#info");
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}
function unlock(i){if(state.done.has(i))return;state.done.add(i);$("#trophyCount").textContent=state.done.size;toast("🏆 Трофей: "+trophies[i][0]);if(state.tab===3)render()}
function theme(t){const s=document.documentElement.style;s.setProperty("--c1",t[0]);s.setProperty("--c2",t[1]);s.setProperty("--acc",t[2])}
function renderTabs(){const n=$("#tabs");n.innerHTML="";tabs.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.className=i===state.tab?"on":"";b.onclick=()=>{state.tab=i;state.visited=(state.visited||new Set()).add(i);if(state.visited.size>=4)unlock(1);render()};n.appendChild(b)})}
function render(){renderTabs();view.innerHTML="";info.innerHTML="";
 if(state.tab===0){const g=games[state.sel];
  document.documentElement.style.setProperty("--c1",g.c[0]+"");document.documentElement.style.setProperty("--c2",g.c[1]);
  info.innerHTML=`<h1>${g.n}</h1><p>${g.g} — ${g.d}</p><div class="bar"><i style="width:${g.p}%"></i></div><div id="actions"><button class="play" id="pl">${g.p>0?"Продолжить":"Играть"}</button><button class="ic" id="fav" title="В избранное">♡</button><button class="ic" id="inf" title="Подробнее">ⓘ</button></div>`;
  $("#pl").onclick=()=>launch(g);$("#fav").onclick=e=>{const b=e.currentTarget;b.textContent=b.textContent==="♡"?"♥":"♡";toast(b.textContent==="♥"?"Добавлено в избранное":"Убрано из избранного")};$("#inf").onclick=()=>toast(g.n+" · прогресс "+g.p+"%");
  const r=document.createElement("div");r.id="row";games.forEach((x,i)=>{const t=document.createElement("button");t.className="tile"+(i===state.sel?" sel":"");t.style.background=`linear-gradient(145deg,${x.c[0]},${x.c[1]})`;t.innerHTML=`<span>${x.n}</span>`;t.onclick=()=>{if(state.sel===i)launch(x);else{state.sel=i;render()}};r.appendChild(t)});view.appendChild(r);
  const s=r.querySelector(".sel");if(s)s.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
 }else{
  const list=state.tab===1?media:state.tab===2?shop:trophies.map((t,i)=>[state.done.has(i)?"🏆":"🔒",t[0],t[1]]);
  info.innerHTML=`<h1>${tabs[state.tab]}</h1><p>${state.tab===3?"Получено "+state.done.size+" из "+trophies.length:"Выбери раздел"}</p>`;
  const gr=document.createElement("div");gr.className="grid";
  list.forEach(it=>{const c=document.createElement("button");c.className="card";c.innerHTML=`<b>${it[0]}</b>${it[1]||""}${it[2]?"<br><small style='color:#8d97b0'>"+it[2]+"</small>":""}`;
   c.onclick=()=>{if(state.tab===1){toast("Открыто: "+it[1]);if(it[1]==="Музыка")unlock(3)}else if(state.tab===2)toast("Магазин: "+it[0]);else toast(it[2])};gr.appendChild(c)});view.appendChild(gr)}
}
function launch(g){state.played.add(g.n);unlock(0);if(state.played.size>=3)unlock(4);
 $("#lt").textContent=g.n;$("#lp").textContent="Загрузка…";open("launch");
 let k=0;clearInterval(launch.t);launch.t=setInterval(()=>{k+=25;$("#lp").textContent=k<100?"Загрузка "+k+"%":"Игра запущена — наслаждайся";if(k>=100)clearInterval(launch.t)},500)}
$("#quit").onclick=()=>{clearInterval(launch.t);closeAll();toast("Возврат на главный экран")};
function open(id){$$(".layer").forEach(l=>l.classList.remove("on"));$("#"+id).classList.add("on")}
function closeAll(){$$(".layer").forEach(l=>l.classList.remove("on"))}
$$("[data-close]").forEach(b=>b.onclick=closeAll);
$$(".layer").forEach(l=>l.addEventListener("click",e=>{if(e.target===l&&l.id!=="launch")closeAll()}));
$("#bCenter").onclick=()=>open("center");$("#bPower").onclick=()=>open("power");$("#avatar").onclick=()=>open("profile");
$("#bSearch").onclick=()=>{open("search");$("#q").value="";find("");setTimeout(()=>$("#q").focus(),50)};
$$(".sw").forEach(s=>s.onclick=()=>{s.classList.toggle("on");toast(s.dataset.t+": "+(s.classList.contains("on")?"вкл":"выкл"))});
$("#vol").oninput=e=>{if(+e.target.value>0)unlock(3)};
$("#bri").oninput=e=>document.body.style.filter=`brightness(${e.target.value/100})`;
const th=$("#themes");themes.forEach(t=>{const b=document.createElement("button");b.style.background=`linear-gradient(135deg,${t[0]},${t[2]})`;b.onclick=()=>{theme(t);userTheme=true;unlock(2);render()};th.appendChild(b)});
let userTheme=false;
function find(v){const r=$("#res");r.innerHTML="";const m=games.filter(g=>g.n.toLowerCase().includes(v.toLowerCase()));if(!m.length){r.textContent="Ничего не найдено";return}
 m.forEach(g=>{const b=document.createElement("button");b.className="card";b.style.cssText="width:100%;margin-bottom:8px";b.textContent=g.n+" · "+g.g;b.onclick=()=>{state.tab=0;state.sel=games.indexOf(g);closeAll();render()};r.appendChild(b)})}
$("#q").oninput=e=>find(e.target.value);
$("#rest").onclick=()=>{closeAll();const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#000;z-index:50;display:grid;place-items:center;color:#8d97b0;cursor:pointer;animation:in .5s";d.textContent="Режим покоя — нажми, чтобы вернуться";d.onclick=()=>d.remove();document.body.appendChild(d)};
$("#restart").onclick=()=>{closeAll();const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#000;z-index:50;display:grid;place-items:center";d.innerHTML='<div class="spin"></div>';document.body.appendChild(d);setTimeout(()=>{d.remove();render();toast("Система перезагружена")},1800)};
$("#rename").onclick=()=>{const n=prompt("Новый ник:",state.nick);if(n&&n.trim()){state.nick=n.trim().slice(0,16);$("#nick").textContent=state.nick;toast("Ник изменён")}};
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){closeAll();return}
 if($(".layer.on")||e.target.tagName==="INPUT")return;
 if(state.tab===0){if(e.key==="ArrowRight"){state.sel=Math.min(games.length-1,state.sel+1);render()}
  if(e.key==="ArrowLeft"){state.sel=Math.max(0,state.sel-1);render()}
  if(e.key==="Enter")launch(games[state.sel])}
 if(e.key==="ArrowUp"){state.tab=Math.max(0,state.tab-1);render()}
 if(e.key==="ArrowDown"){state.tab=Math.min(3,state.tab+1);render()}
});
function tick(){const d=new Date();$("#clock").textContent=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
tick();setInterval(tick,10000);render();
</script>
</body>
</html>
